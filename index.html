<style>

.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(470px,100%),1fr))}

.tli .w{font-size:12px;color:var(--mut);font-weight:600}.tli .p{font-weight:600}.tli .d{display:none;color:var(--mut);font-size:13px;margin-top:4px}.tli.open .d{display:block}

 .h4{gap:10px;margin-top:16px}.hcard{padding:12px 12px 10px;border-radius:16px}.hcard .v{font-size:26px}.hcard .l{font-size:12px}.hcard .ch{font-size:12px}.hcard .s{font-size:11px}.hcard .asof{font-size:10.5px;padding:2px 7px}.hcard .spark{height:30px}
